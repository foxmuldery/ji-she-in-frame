<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>试玩记录 · 复盘</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
<style>
:root{
  --bg:#0a0b09; --panel:#111310; --line:rgba(216,201,168,.16);
  --bone:#d8c9a8; --dim:rgba(216,201,168,.5); --faint:rgba(216,201,168,.3);
  --red:#c04a38; --red-dim:rgba(192,74,56,.5);
  --green:#7fae94; --amber:#c9a04a;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--bone);}
body{
  font:14px/1.7 "PingFang SC","Songti SC","Courier New",monospace;
  padding:28px 22px 80px; min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -10%, rgba(192,74,56,.10), transparent 60%);
}
a{color:var(--bone);}
.wrap{max-width:1080px;margin:0 auto;}
h1{font-size:22px;letter-spacing:.18em;font-weight:500;margin:0 0 6px;}
.sub{color:var(--dim);font-size:12px;letter-spacing:.08em;margin-bottom:22px;}

/* drop */
#drop{
  border:1px dashed rgba(216,201,168,.3); padding:34px 22px; text-align:center;
  background:rgba(216,201,168,.02); transition:.15s; cursor:pointer;
}
#drop.over{border-color:var(--red);background:rgba(192,74,56,.08);}
#drop b{display:block;font-size:15px;letter-spacing:.1em;margin-bottom:6px;font-weight:500;}
#drop span{color:var(--dim);font-size:12px;}
#file{display:none;}
.pick{
  display:inline-block;margin-top:14px;padding:7px 16px;cursor:pointer;
  border:1px solid rgba(216,201,168,.3); font-size:12px; letter-spacing:.08em;
}
.pick:hover{border-color:var(--bone);}

/* session list */
.sessions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;}
.sess{
  padding:7px 11px;border:1px solid var(--line);cursor:pointer;
  font-size:11px;line-height:1.5;color:var(--dim);background:rgba(216,201,168,.02);
}
.sess.on{border-color:var(--red-dim);color:var(--bone);background:rgba(192,74,56,.1);}
.sess b{color:var(--bone);font-weight:500;}
.sess.all{border-color:rgba(201,160,74,.4);color:var(--amber);}

/* aggregate across sessions */
.agg{display:block;}
.agg .card{margin:0 0 9px;}
.aggGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:12px 0 4px;}
.aggGrid .card{margin:0;}
.aggTable{width:100%;border-collapse:collapse;margin:14px 0 4px;font-size:12px;}
.aggTable th,.aggTable td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);color:var(--dim);}
.aggTable th{font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:400;}
.aggTable td{color:var(--bone);font-variant-numeric:tabular-nums;}
.aggTable tr:last-child td{border-bottom:0;}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin:18px 0;}
.card{border:1px solid var(--line);padding:11px 13px;background:rgba(216,201,168,.02);}
.card .k{font-size:10px;letter-spacing:.14em;color:var(--faint);}
.card .v{font-size:19px;line-height:1.35;margin-top:3px;font-variant-numeric:tabular-nums;}
.card .v small{font-size:11px;color:var(--dim);letter-spacing:.04em;}
.card.good .v{color:var(--green);}
.card.warn .v{color:var(--amber);}
.card.bad .v{color:var(--red);}

h2{font-size:13px;letter-spacing:.16em;font-weight:500;color:var(--dim);
   margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
h2 .hint{font-size:10px;letter-spacing:.04em;color:var(--faint);font-weight:400;float:right;}

/* chapters */
.chap{display:flex;flex-direction:column;gap:5px;}
.chrow{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim);}
.chrow .nm{width:92px;flex:none;color:var(--bone);}
.chrow .bar{height:12px;background:rgba(192,74,56,.35);min-width:2px;}
.chrow .ms{font-variant-numeric:tabular-nums;color:var(--faint);}

/* key heat */
.heat{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;height:56px;}
.heat i{display:block;width:5px;background:rgba(216,201,168,.35);}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.key{border:1px solid var(--line);padding:3px 7px;font-size:11px;color:var(--dim);}
.key b{color:var(--bone);font-weight:500;}

/* table */
table{width:100%;border-collapse:collapse;font-size:11.5px;}
th{text-align:left;font-weight:400;color:var(--faint);letter-spacing:.1em;
   border-bottom:1px solid var(--line);padding:5px 7px;font-size:10px;}
td{padding:4px 7px;border-bottom:1px solid rgba(216,201,168,.06);vertical-align:top;}
tr.say td:nth-child(2){color:#e8dfc8;}
tr.prompt td:nth-child(2){color:var(--amber);}
tr.goal td:nth-child(2){color:var(--green);}
tr.chapter td:nth-child(2){color:var(--red);}
tr.ending td:nth-child(2),tr.endscreen td:nth-child(2){color:#f0c0a0;font-weight:500;}
tr.jank td:nth-child(2),tr.gap td:nth-child(2){color:var(--amber);}
tr.error td:nth-child(2){color:#e0483a;}
td.t{width:66px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
td.d{width:64px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
tr.flash{background:rgba(192,74,56,.12);}

/* controls */
.ctl{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;}
.chip{padding:4px 10px;border:1px solid var(--line);cursor:pointer;font-size:11px;color:var(--dim);}
.chip.on{border-color:var(--red-dim);color:var(--bone);background:rgba(192,74,56,.1);}
button.act{
  padding:5px 12px;background:rgba(216,201,168,.04);color:var(--bone);
  border:1px solid rgba(216,201,168,.24);font:11px/1.6 "PingFang SC",monospace;
  letter-spacing:.06em;cursor:pointer;
}
button.act:hover{border-color:var(--bone);}
textarea{
  width:100%;min-height:70px;background:rgba(216,201,168,.04);color:#e8dfc8;
  border:1px solid var(--line);padding:8px;font:12px/1.6 "PingFang SC",monospace;resize:vertical;
}
.meta{font-size:11px;color:var(--faint);line-height:1.9;word-break:break-all;}
.empty{color:var(--faint);font-size:12px;padding:10px 0;}
.pill{display:inline-block;padding:1px 7px;border:1px solid var(--line);font-size:10px;color:var(--dim);margin-left:6px;}
.pill.help{border-color:rgba(127,174,148,.6);color:var(--green);}
.pill.film{border-color:rgba(201,160,74,.6);color:var(--amber);}
.pill.bad{border-color:rgba(224,72,58,.6);color:#e0483a;}
#out{display:none;}
@media (max-width:640px){
  .card .v{font-size:16px;}
  td.d{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>试玩记录 · 复盘</h1>
  <div class="sub">把 <code>ji-playtest_*.json</code> 拖进来。文件只在本机解析，不会上传。</div>

  <div id="drop">
    <b>拖入记录文件</b>
    <span>支持多份，可以横向比较；也可以只开一份看时间线</span>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <label class="pick" style="margin-top:0">选择文件<input id="file" type="file" accept=".json,application/json" multiple></label>
      <button class="pick" id="demo" type="button" style="margin-top:0">载入示例</button>
    </div>
  </div>

  <div class="sessions" id="sessions"></div>
  <div id="view"></div>
</div>

<script>
(function(){
'use strict';
const S={ sessions:[], active:0, filter:'story' };
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clock(ms){
  ms=Math.max(0,Math.round(ms||0));
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}
function dur(ms){
  if(!ms) return '—';
  return ms>=60000?clock(ms):(ms/1000).toFixed(1)+'s';
}

/* ---------- load ---------- */
function norm(raw){
  const d=typeof raw==='string'?JSON.parse(raw):raw;
  const meta=d.session||{};
  const events=(d.events||[]).filter(e=>e&&typeof e==='object');
  const summary=d.summary||{};
  return { meta, events, summary, raw:d, name:meta.tester||'', id:meta.id||('s'+Math.random().toString(36).slice(2,7)) };
}
function addSession(raw){
  try {
    const s=norm(raw);
    if(!s.events.length && !s.meta) return false;
    S.sessions.push(s); return true;
  } catch(err){ console.warn(err); return false; }
}
async function loadFiles(files){
  let n=0;
  for(const f of files){
    if(!/\.json$/i.test(f.name)) continue;
    const txt=await f.text();
    if(await tryAdd(txt)) n++;
  }
  toast(n?('已载入 '+n+' 份记录'):'没有可解析的 JSON');
  if(S.sessions.length) { S.active=S.sessions.length-1; render(); }
}
async function tryAdd(txt){
  try { return addSession(JSON.parse(txt)); } catch(err){ return false; }
}
const drop=$('#drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });
$('#file').addEventListener('change',e=>{ loadFiles(e.target.files); e.target.value=''; });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();
  if(e.dataTransfer&&e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
});

function demoSession(opt){
  // synthetic, clearly-labelled sample so the page is never a blank wall
  opt=opt||{};
  const ending=opt.ending===undefined?'help':opt.ending;
  const stopAt=opt.stopAt||0;
  const speed=opt.speed||1;
  const ev=[]; let t=0;
  const push=(type,o)=>{ ev.push(Object.assign({t:t,type:type},o||{})); };
  push('begin',{ua:'（示例数据，不是真实记录）',viewport:[1440,900]});
  push('state',{d:{chapter:1,scene:'room'},first:1});
  const say=(text,ms)=>{ push('say',{text:text}); t+=ms; };
  const prompt=(text,ms)=>{ push('prompt',{text:text}); t+=ms; };
  const keys=(k,n)=>{ for(let i=0;i<n;i++){ push('key',{k:k,down:1}); push('key',{k:k,down:0}); t+=140; } };
  say('她跟男友回村。屋里只有一位老妇。',3600);
  prompt('W 前进　/　E 靠近她',4200);
  keys('W',14); keys('E',1);
  say('老妇：手给我看看。',3200);
  prompt('按住 F 举起 DV',5000);
  keys('F',1);
  push('chapter',{n:2});
  t+=5600;
  say('第二遍。椅子上没有人。',3600);
  prompt('F 取景器找她　/　E 靠近她',5600);
  keys('F',3); keys('A',6); keys('S',9);
  push('gap',{ms:38000,where:'第 2 遍'});
  t+=38000;
  say('帘子后面。',2400);
  keys('E',1);
  push('chapter',{n:3}); t+=4200;
  say('第三遍。房间暗了。有三处不对。',3600);
  prompt('F 看取景器　/　L 快门',5600);
  keys('L',3); t+=2600;
  push('jank',{ms:312});
  push('chapter',{n:4}); t+=6100;
  say('第四遍。她站起来了。躲好。',3200);
  keys('E',4); t+=5200;
  push('chapter',{n:5}); t+=6300;
  say('最后一遍。先拍她。',3200);
  keys('F',2); keys('L',1);
  push('state',{d:{'final.photo':1}});
  t+=6400;
  push('chapter',{n:5}); t+=1300;
  say('暗房的门在身后合上。她坐回椅子。',3800);
  keys('Q',1); t+=2400;
  if(!stopAt){
    push('ending',{kind:ending}); t+=2200;
    push('endscreen',{title:ENDING_TITLE[ending]||'结局'});
  }
  t=Math.round(t*speed);
  for(const e of ev) e.t=Math.round(e.t*speed);
  return {schema:'ji-playtest/1', demo:true,
    session:{id:'demo-'+(opt.id||'0001'), tester:opt.tester||'示例', startedAt:new Date().toISOString(),
      notes:'这是合成示例，用来演示复盘页长什么样。', viewport:[1440,900], dpr:2,
      userAgent:'示例数据'},
    summary:{durationMs:t, gameSeconds:t/1000, ending:stopAt?'':ending, chapter:stopAt||5, keys:60,
      progress:{photos:3,corridorSeen:3,darkSeen:3,spliced:true,printed:true},
      chapterTimes:[{chapter:1,ms:1},{chapter:2,ms:1}]},
    events:ev};
}
const ENDING_TITLE={help:'你走过去了。',film:'你一直在拍她。',bad:'她替你摆好了。'};
function loadDemo(){
  // Three runs, not one: a single session cannot show a distribution, and the
  // whole point of the aggregate view is where people stop and how long each
  // pass takes. Labelled 示例 A/B/C and clearly synthetic.
  addSession(demoSession({id:'0001',tester:'示例 A · help',ending:'help'}));
  addSession(demoSession({id:'0002',tester:'示例 B · film（慢）',ending:'film',speed:1.18}));
  addSession(demoSession({id:'0003',tester:'示例 C · 第三遍停下',stopAt:3,speed:0.42}));
  S.active=S.sessions.length-1; render();
}
document.getElementById('demo').addEventListener('click',()=>{
  loadDemo(); toast('已载入 3 份示例');
});

const QS=new URLSearchParams(location.search);
if(QS.get('demo')==='1'){
  loadDemo();
  if(QS.get('agg')==='1'){ S.active=-1; render(); }
}
const src=QS.get('src');
if(src){
  fetch(src).then(r=>r.text()).then(tryAdd).then(ok=>{
    if(ok){ S.active=0; render(); }
  }).catch(()=>{});
}

/* ---------- derived ---------- */
function endingOf(s){
  const e=(s.events||[]).filter(x=>x.type==='ending').pop();
  return (e&&e.kind)||s.summary.ending||'';
}
function durationOf(s){
  const last=(s.events.length?s.events[s.events.length-1].t:0)||0;
  const wall=Math.max(s.summary.durationMs||0,last);
  const game=(s.summary.gameSeconds||0)*1000;
  return { wall, game, shown: game>wall*0.6?game:wall };
}
function chaptersOf(s){
  const out=[]; const at={}; let prev=null;
  for(const e of s.events){
    if(e.type!=='chapter') continue;
    if(prev!=null) out.push({chapter:prev, ms:Math.max(0,e.t-(at[prev]||0)), t:at[prev]});
    prev=e.n; at[e.n]=e.t;
  }
  if(prev!=null){
    const end=durationOf(s).wall;
    out.push({chapter:prev, ms:Math.max(0,end-(at[prev]||0)), t:at[prev]});
  }
  if(!out.length && (s.summary.chapterTimes||[]).length){
    return s.summary.chapterTimes.map(x=>({chapter:x.chapter, ms:x.ms, t:0}));
  }
  return out;
}
function textRows(s){
  const rows=[];
  for(let i=0;i<s.events.length;i++){
    const e=s.events[i];
    if(e.type!=='say'&&e.type!=='prompt'&&e.type!=='goal') continue;
    let next=null;
    for(let j=i+1;j<s.events.length;j++){
      if(['say','prompt','goal'].includes(s.events[j].type)){ next=s.events[j].t; break; }
    }
    rows.push({t:e.t, type:e.type, text:e.text||e.obj||'', dwell:next!=null?next-e.t:null});
  }
  return rows;
}
function keyCounts(s){
  const c={};
  for(const e of s.events) if(e.type==='key'&&e.down) c[e.k]=(c[e.k]||0)+1;
  return Object.keys(c).map(k=>({k,n:c[k]})).sort((a,b)=>b.n-a.n);
}
function keyShares(s){
  const list=keyCounts(s); const total=list.reduce((n,x)=>n+x.n,0)||1;
  return list.map(x=>x.k+' '+Math.round(x.n/total*100)+'%').join(' · ');
}
function gapsOf(s){ return s.events.filter(e=>e.type==='gap'||e.type==='jank'||(e.type==='error')); }

/* ---------- render ---------- */
function render(){
  renderSessions();
  const v=$('#view'); v.innerHTML='';
  if(!S.sessions.length){
    return;
  }
  if(S.active===-1){ v.appendChild(renderAggregate()); return; }
  const s=S.sessions[S.active];
  v.appendChild(renderHead(s));
  v.appendChild(renderCards(s));
  v.appendChild(renderProgress(s));
  v.appendChild(renderChapters(s));
  v.appendChild(renderKeys(s));
  v.appendChild(renderIssues(s));
  v.appendChild(renderNotes(s));
  v.appendChild(renderTimeline(s));
  v.appendChild(renderExport(s));
}
function renderSessions(){
  const box=$('#sessions'); box.innerHTML='';
  if(S.sessions.length>1){
    const a=el('button','sess all'+(S.active===-1?' on':''),
      '<b>全部 '+S.sessions.length+' 份</b> · 横向比较');
    a.onclick=()=>{ S.active=-1; render(); };
    box.appendChild(a);
  }
  S.sessions.forEach((s,i)=>{
    const end=endingOf(s);
    const b=el('button','sess'+(i===S.active?' on':''));
    b.innerHTML='<b>'+esc(s.meta.tester||s.id)+'</b> · '+dur(durationOf(s).shown)+
      (end?' · '+esc(end):' · 未到结局');
    b.onclick=()=>{ S.active=i; render(); };
    box.appendChild(b);
  });
}

/* ---------- aggregate ----------
   One playtester is an anecdote. After four or five runs the interesting
   questions are distributional: where do people stop, which chapter eats the
   time, do the endings split the way the design assumes. */
function med(list){
  const a=list.filter(x=>typeof x==='number'&&isFinite(x)).sort((x,y)=>x-y);
  if(!a.length) return null;
  const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function quant(list,q){
  const a=list.filter(x=>typeof x==='number'&&isFinite(x)).sort((x,y)=>x-y);
  if(!a.length) return null;
  const i=Math.min(a.length-1,Math.max(0,Math.round((a.length-1)*q)));
  return a[i];
}
function renderAggregate(){
  const box=el('div','agg');
  const n=S.sessions.length;
  const ends={help:0,film:0,bad:0,'':0};
  const durs=[], dursGame=[];
  const byChapter={1:[],2:[],3:[],4:[],5:[]};
  const stops=[];
  let gaps=0, gapMax=0, jank=0, errs=0;
  const keyTotals={};
  for(const s of S.sessions){
    const e=endingOf(s)||'';
    ends[e]=(ends[e]||0)+1;
    const d=durationOf(s);
    durs.push(d.shown); if(d.game) dursGame.push(d.game);
    for(const c of chaptersOf(s)) if(byChapter[c.chapter]) byChapter[c.chapter].push(c.ms);
    for(const g of gapsOf(s)){
      if(g.type==='gap'){ gaps++; gapMax=Math.max(gapMax,g.ms||0); }
      if(g.type==='jank') jank++;
      if(g.type==='error') errs++;
    }
    if(!e){
      const cs=chaptersOf(s);
      const last=cs.length?cs[cs.length-1].chapter:(s.summary.chapter||1);
      stops.push(last);
    }
    for(const row of keyCounts(s)) keyTotals[row.k]=(keyTotals[row.k]||0)+row.n;
  }
  const head=el('div','card');
  head.innerHTML='<div class="k">全部记录</div><div class="v">'+n+' 份 · '+(
    (ends.help||0)+(ends.film||0)+(ends.bad||0))+' 份到结局 · '+stops.length+' 份中途停下</div>'+
    '<div class="n">下面的数字都是跨会话中位数；单份记录点上面的人名看细节。</div>';
  box.appendChild(head);

  const grid=el('div','aggGrid');
  const card=(k,v,note)=>{
    const c=el('div','card');
    c.innerHTML='<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'+
      (note?'<div class="n">'+esc(note)+'</div>':'');
    grid.appendChild(c);
  };
  const p50=med(durs);
  card('时长中位', p50?clock(p50):'—',
    durs.length?'范围 '+clock(quant(durs,0))+' – '+clock(quant(durs,1)):'');
  card('结局', 'help '+((ends.help||0))+' · film '+((ends.film||0))+' · bad '+((ends.bad||0)), '');
  card('中途停下', stops.length?stops.length+' 份':'0 份',
    stops.length?'停在 '+(med(stops)!==null?('第 '+med(stops)+' 遍（中位）'):'')+'，最长一次 '+(
      stops.length?('第 '+Math.max.apply(null,stops)+' 遍'):'') :'');
  card('卡顿', (gaps+gaps+jank?String(gaps+jank):'0')+' 次',
    '最长一次停顿 '+dur(gapMax)+(errs?'　·　报错 '+errs+' 次':''));
  const keyLine=Object.keys(keyTotals).sort((a,b)=>keyTotals[b]-keyTotals[a]).slice(0,5)
    .map(k=>k+' '+keyTotals[k]).join(' · ');
  card('按键总量', String(Object.values(keyTotals).reduce((a,b)=>a+b,0)), keyLine);
  box.appendChild(grid);

  // per-chapter medians, the thing that says which pass is too long
  const rows=el('table','aggTable');
  rows.innerHTML='<thead><tr><th>章节</th><th>中位</th><th>范围</th><th>样本</th></tr></thead>';
  const tb=el('tbody');
  const names={1:'第一遍 · 供桌',2:'第二遍 · 找她',3:'第三遍 · 拍异常',4:'第四遍 · 躲她',5:'最后一遍 / 走廊 / 暗房'};
  for(const k of [1,2,3,4,5]){
    const list=byChapter[k];
    const tr=el('tr');
    tr.innerHTML='<td>'+names[k]+'</td><td>'+(
      med(list)!==null?dur(med(list)):'—')+'</td><td>'+(
      list.length?dur(quant(list,0))+' – '+dur(quant(list,1)):'—')+'</td><td>'+list.length+'</td>';
    tb.appendChild(tr);
  }
  rows.appendChild(tb);
  box.appendChild(rows);

  const cmp=el('table','aggTable');
  cmp.innerHTML='<thead><tr><th>记录</th><th>时长</th><th>结局</th><th>停在第几遍</th><th>停顿 / 卡顿</th></tr></thead>';
  const cb=el('tbody');
  for(const s of S.sessions){
    const d=durationOf(s), e=endingOf(s);
    const cs=chaptersOf(s);
    const tr=el('tr');
    tr.innerHTML='<td>'+esc(s.meta.tester||s.id)+'</td><td>'+dur(d.shown)+'</td><td>'+
      (e?'<span class="pill '+e+'">'+esc(e)+'</span>':'未到结局')+'</td><td>'+
      (e?'—':(cs.length?cs[cs.length-1].chapter:'1'))+'</td><td>'+
      gapsOf(s).length+'</td>';
    cb.appendChild(tr);
  }
  cmp.appendChild(cb);
  box.appendChild(cmp);
  return box;
}
function renderHead(s){
  const head=el('div','');
  const m=s.meta;
  head.innerHTML='<div class="meta">'+
    '记录 <b>'+esc(s.id)+'</b>'+
    (m.startedAt?' · '+esc(new Date(m.startedAt).toLocaleString()):'')+
    (m.viewport?' · 窗口 '+m.viewport.join('×'):'')+
    (m.dpr?' @'+m.dpr+'x':'')+
    (m.language?' · '+esc(m.language):'')+
    (m.timezone?' · '+esc(m.timezone):'')+
    '<br>'+esc(m.userAgent||'')+
    (m.url?'<br>'+esc(m.url):'')+
    '</div>';
  return head;
}
function renderCards(s){
  const d=durationOf(s);
  const end=endingOf(s);
  const g=$('#view');
  const grid=el('div','grid');
  const card=(k,v,cls)=>'<div class="card'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  const keys=keyCounts(s).reduce((n,x)=>n+x.n,0);
  const longest=(s.events.filter(e=>e.type==='gap').sort((a,b)=>b.ms-a.ms)[0])||null;
  const jank=s.events.filter(e=>e.type==='jank');
  const errs=s.events.filter(e=>e.type==='error');
  let html='';
  const usedGame=d.game>d.wall*0.6;
  html+=card('试玩时长', clock(d.shown)+(usedGame?'<small> 游戏内</small>':(d.game?'<small> 墙钟</small>':'')), d.shown>=480000?'good':(d.shown<240000?'warn':''));
  html+=card('结局', end?esc(end):'<span style="color:var(--faint);font-size:13px">未到结局</span>',
    end==='help'?'good':(end==='bad'?'bad':(end?'warn':'')));
  html+=card('到达章节', '<span>第 '+Math.max(1,s.summary.chapter||(chaptersOf(s).length||1))+' 遍</span>');
  html+=card('按键', keys+'<small> 次</small>');
  html+=card('最长停顿', longest?dur(longest.ms):'—', longest&&longest.ms>45000?'warn':'');
  html+=card('卡顿', (jank.length?jank.length+'<small> 次 · 最大 '+Math.max.apply(null,jank.map(x=>x.ms))+'ms</small>':'<small>无</small>'),
    jank.length?'warn':'good');
  html+=card('报错', errs.length?String(errs.length):'<small>无</small>', errs.length?'bad':'good');
  grid.innerHTML=html;
  return grid;
}
function renderProgress(s){
  const p=s.summary.progress;
  const box=el('div','');
  if(!p){ return box; }
  const dot=(ok)=>ok?'<span style="color:var(--green)">●</span>':'<span style="color:var(--faint)">○</span>';
  box.innerHTML='<h2>进度<span class="hint">这一局玩家实际走到哪</span></h2>'+
    '<div class="meta">'+
      dot(p.photos>=1)+' 拍照 '+p.photos+'/3　'+
      dot(p.corridorSeen>=1)+' 走廊观察 '+p.corridorSeen+'/3　'+
      dot(p.darkSeen>=1)+' 暗房显影 '+p.darkSeen+'/3　'+
      dot(p.spliced)+' 接带　'+dot(p.printed)+' 洗印'+
    '</div>';
  return box;
}
function renderChapters(s){
  const ch=chaptersOf(s);
  const box=el('div','');
  box.innerHTML='<h2>分章耗时<span class="hint">从进入该遍到离开</span></h2>';
  if(!ch.length){ box.appendChild(el('div','empty','（这份记录没有章节事件）')); return box; }
  const max=Math.max.apply(null,ch.map(c=>c.ms))||1;
  const wrap=el('div','chap');
  ch.forEach(c=>{
    const row=el('div','chrow');
    row.innerHTML='<span class="nm">第 '+c.chapter+' 遍</span>'+
      '<span class="bar" style="width:'+Math.max(2,Math.round(c.ms/max*420))+'px"></span>'+
      '<span class="ms">'+dur(c.ms)+'</span>';
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  return box;
}
function renderKeys(s){
  const box=el('div','');
  const counts=keyCounts(s);
  if(!counts.length) return box;
  box.innerHTML='<h2>按键<span class="hint">'+esc(keyShares(s))+'</span></h2>';
  // 30-second activity heat
  const d=durationOf(s).wall||1;
  const bins=new Array(Math.max(1,Math.ceil(d/30000))).fill(0);
  for(const e of s.events) if(e.type==='key'&&e.down){
    const i=Math.min(bins.length-1,Math.floor(e.t/30000));
    bins[i]++;
  }
  const max=Math.max.apply(null,bins)||1;
  const heat=el('div','heat');
  bins.forEach((n,i)=>{
    const b=el('i');
    b.style.height=Math.max(2,Math.round(n/max*54))+'px';
    b.style.background=n?'rgba(192,74,56,'+(0.25+0.6*n/max)+')':'rgba(216,201,168,.12)';
    b.title='第'+(i+1)+'个 30 秒：'+n+' 次';
    heat.appendChild(b);
  });
  box.appendChild(heat);
  const ks=el('div','keys');
  counts.forEach(x=>ks.appendChild(el('span','key',esc(x.k)+' <b>'+x.n+'</b>')));
  box.appendChild(ks);
  return box;
}
function renderIssues(s){
  const box=el('div','');
  const rows=gapsOf(s);
  if(!rows.length) return box;
  box.innerHTML='<h2>停顿 / 卡顿 / 报错<span class="hint">最值得先看的三类信号</span></h2>';
  const tb=el('table');
  tb.innerHTML='<thead><tr><th>时间</th><th>类型</th><th>内容</th></tr></thead>';
  const body=el('tbody');
  rows.slice(0,60).forEach(e=>{
    const tr=el('tr',e.type);
    const what=e.type==='gap'?('无操作 '+dur(e.ms)+'（'+(e.where||'')+'）')
      :e.type==='jank'?('掉帧 '+e.ms+'ms')
      :('错误：'+(e.msg||''));
    tr.innerHTML='<td class="t">'+clock(e.t)+'</td><td>'+e.type+'</td><td>'+esc(what)+'</td>';
    body.appendChild(tr);
  });
  tb.appendChild(body);
  box.appendChild(tb);
  return box;
}
function renderNotes(s){
  const box=el('div','');
  box.innerHTML='<h2>试玩者备注<span class="hint">会一起导出</span></h2>';
  const ta=el('textarea');
  ta.value=s.meta.notes||'';
  ta.placeholder='他/她说了什么？哪里卡住、哪里吓到、哪句没看懂';
  ta.oninput=()=>{ s.meta.notes=ta.value; };
  box.appendChild(ta);
  return box;
}
function renderTimeline(s){
  const box=el('div','');
  box.innerHTML='<h2>时间线<span class="hint">字幕停留时间是自动算的</span></h2>';
  const ctl=el('div','ctl');
  const filters=[['story','只看文字线'],['state','状态变化'],['key','按键'],['all','全部']];
  filters.forEach(([id,label])=>{
    const c=el('span','chip'+(S.filter===id?' on':''),label);
    c.onclick=()=>{ S.filter=id; render(); };
    ctl.appendChild(c);
  });
  box.appendChild(ctl);

  const tb=el('table');
  tb.innerHTML='<thead><tr><th>时间</th><th>内容</th><th>停留</th></tr></thead>';
  const body=el('tbody');
  let n=0;
  for(const e of s.events){
    const isStory=e.type==='say'||e.type==='prompt'||e.type==='goal'||e.type==='chapter'||
      e.type==='ending'||e.type==='endscreen'||e.type==='mark'||e.type==='rec'||
      e.type==='jank'||e.type==='gap'||e.type==='error';
    const isState=e.type==='state';
    const isKey=e.type==='key'&&e.down;
    let show=false;
    if(S.filter==='all') show=isStory||isState||isKey;
    else if(S.filter==='story') show=isStory&&e.type!=='jank'&&e.type!=='gap';
    else if(S.filter==='state') show=isState;
    else if(S.filter==='key') show=isKey;
    if(!show) continue;
    if(++n>400){ break; }
    let text='', dwell='';
    if(e.type==='say') text='「'+e.text+'」';
    else if(e.type==='prompt') text='提示 · '+e.text;
    else if(e.type==='goal') text='目标 · '+e.name+'　'+e.obj;
    else if(e.type==='chapter') text='进入第 '+e.n+' 遍';
    else if(e.type==='ending') text='结局 · '+e.kind;
    else if(e.type==='endscreen') text='结局卡 · '+e.title;
    else if(e.type==='key') text='按下 '+e.k+(e.mods?(' ['+e.mods+']'):'');
    else if(e.type==='state'){
      const ks=Object.keys(e.d||{});
      text='状态 · '+ks.slice(0,6).map(k=>k+'='+e.d[k]).join(' ')+(ks.length>6?(' …+'+ks.length):'');
    }
    else if(e.type==='mark') text='标记 · '+(e.tag||'');
    else if(e.type==='rec') text=e.on?'开始录屏':'录屏结束 '+dur(e.ms)+' · '+Math.round((e.bytes||0)/1048576)+'MB';
    else if(e.type==='jank') text='掉帧 '+e.ms+'ms';
    else if(e.type==='gap') text='无操作 '+dur(e.ms);
    else if(e.type==='error') text='错误 · '+e.msg;
    if(e.type==='say'||e.type==='prompt'){
      const i=s.events.indexOf(e);
      let next=null;
      for(let j=i+1;j<s.events.length;j++){
        const t=s.events[j].type;
        if(t==='say'||t==='prompt'||t==='goal'){ next=s.events[j].t; break; }
      }
      if(next!=null&&next>e.t) dwell=dur(next-e.t);
    }
    const tr=el('tr',e.type);
    tr.innerHTML='<td class="t">'+clock(e.t)+'</td><td>'+esc(text)+'</td><td class="d">'+dwell+'</td>';
    body.appendChild(tr);
  }
  if(!n) body.innerHTML='<tr><td colspan="3" class="empty">这个筛选下没有事件</td></tr>';
  tb.appendChild(body);
  box.appendChild(tb);
  if(n>400) box.appendChild(el('div','empty','只显示前 400 条，导出 Markdown / CSV 可以看全量。'));
  return box;
}
function markdownOf(s){
  const d=durationOf(s);
  const end=endingOf(s);
  const keys=keyCounts(s);
  const L=[];
  L.push('# 试玩记录 · '+(s.meta.tester||s.id));
  L.push('');
  L.push('- 记录 ID：`'+s.id+'`');
  L.push('- 时间：'+(s.meta.startedAt?new Date(s.meta.startedAt).toLocaleString():'—'));
  L.push('- 时长：'+clock(d.shown)+'（游戏内 '+(s.summary.gameSeconds||0)+'s）');
  L.push('- 结局：'+(end||'未到结局')+'　到达：第 '+(s.summary.chapter||1)+' 遍');
  L.push('- 窗口：'+(s.meta.viewport||[]).join('×')+' @'+(s.meta.dpr||1)+'x　UA：'+(s.meta.userAgent||''));
  const ch=chaptersOf(s);
  if(ch.length) L.push('- 分章：'+ch.map(c=>'第'+c.chapter+'遍 '+dur(c.ms)).join(' · '));
  if(keys.length) L.push('- 按键：'+keys.map(x=>x.k+'×'+x.n).join(' · '));
  const p=s.summary.progress;
  if(p) L.push('- 进度：拍照 '+p.photos+'/3 · 走廊 '+p.corridorSeen+'/3 · 暗房 '+p.darkSeen+'/3'+(p.spliced?' · 已接带':'')+(p.printed?' · 已洗印':''));
  const gaps=s.events.filter(e=>e.type==='gap').sort((a,b)=>b.ms-a.ms).slice(0,5);
  if(gaps.length) L.push('- 最长停顿：'+gaps.map(g=>dur(g.ms)+(g.where?'（'+g.where+'）':'')).join(' · '));
  const jank=s.events.filter(e=>e.type==='jank');
  if(jank.length) L.push('- 卡顿：'+jank.length+' 次，最大 '+Math.max.apply(null,jank.map(x=>x.ms))+'ms');
  if(s.meta.notes) L.push('- 备注：'+s.meta.notes);
  L.push('');
  L.push('## 文字线');
  L.push('');
  L.push('| 时间 | 类型 | 内容 | 停留 |');
  L.push('| --- | --- | --- | --- |');
  textRows(s).slice(0,200).forEach(r=>{
    L.push('| '+clock(r.t)+' | '+r.type+' | '+(r.text||'').replace(/\|/g,'\\|')+' | '+(r.dwell!=null?dur(r.dwell):'')+' |');
  });
  return L.join('\n');
}
function csvOf(s){
  const rows=[['t_ms','type','detail']];
  for(const e of s.events){
    let d='';
    if(e.type==='say'||e.type==='prompt') d=e.text||'';
    else if(e.type==='goal') d=(e.name||'')+' '+(e.obj||'');
    else if(e.type==='key') d=e.k+(e.down?' down':' up');
    else if(e.type==='state') d=JSON.stringify(e.d||{});
    else if(e.type==='chapter') d='chapter '+e.n;
    else if(e.type==='ending') d=e.kind;
    else if(e.type==='gap') d='gap '+e.ms;
    else if(e.type==='jank') d='jank '+e.ms;
    else if(e.type==='error') d=e.msg;
    else d=JSON.stringify(e);
    rows.push([e.t,e.type,String(d).replace(/"/g,'""')]);
  }
  return rows.map(r=>r.map(c=>'"'+c+'"').join(',')).join('\n');
}
function renderExport(s){
  const box=el('div','');
  box.innerHTML='<h2>导出</h2>';
  const bar=el('div','ctl');
  const mk=(label,fn)=>{ const b=el('button','act',label); b.onclick=fn; bar.appendChild(b); };
  mk('复制 Markdown',()=>{
    const t=markdownOf(s);
    navigator.clipboard.writeText(t).then(()=>toast('已复制，粘给我就行'),()=>toast('复制失败，用下载'));
  });
  mk('下载 Markdown',()=>save('ji-report_'+s.id+'.md',markdownOf(s),'text/markdown'));
  mk('下载 CSV',()=>save('ji-events_'+s.id+'.csv',csvOf(s),'text/csv'));
  mk('回到顶部',()=>window.scrollTo({top:0,behavior:'smooth'}));
  box.appendChild(bar);
  box.appendChild(el('div','empty','记录文件本身（JSON）就是唯一事实来源；Markdown / CSV 只是方便贴给我或做表。'));
  return box;
}
function save(name,text,mime){
  const b=new Blob([text],{type:mime+';charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
}
let toastT=0;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);'+
      'background:rgba(12,10,8,.96);border-left:2px solid #c04a38;padding:9px 15px;'+
      'font-size:12px;color:#e8dfc8;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.6)';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.display='block';
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ t.style.display='none'; },4200);
}
window.__jiReport={ sessions:S.sessions, add:addSession, render, markdownOf, csvOf };
})();
</script>
